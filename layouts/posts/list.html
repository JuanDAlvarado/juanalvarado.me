{{ define "main" }}
<div style="max-width: 900px; margin: 0 auto; padding: 2rem 1rem;">
  <h1 style="margin-bottom: 2rem;">Posts</h1>
  {{ range .Pages.ByDate.Reverse }}
  <div style="margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border);">
    <a href="{{ .Permalink }}" style="font-size: 1.3rem; font-weight: bold; text-decoration: underline;">{{ .Title }}</a>
    <p style="color: var(--secondary); font-size: 0.85rem; margin: 0.25rem 0 0.5rem;">{{ .Date.Format "January 2, 2006" }}</p>
    <p style="color: var(--secondary); font-size: 0.95rem;">{{ .Summary | truncate 120 }}</p>
  </div>
  {{ end }}
</div>
{{ end }}
